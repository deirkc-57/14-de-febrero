<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Valentín ❤️‍🔥</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            animation: fondoCambio 5s infinite alternate;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            font-family: Arial, sans-serif;
            position: relative;
        }

        @keyframes fondoCambio {
            0% { background-color: #ffb6c1; }
            50% { background-color: #ff69b4; }
            100% { background-color: #ff1493; }
        }

        .corazon {
            position: absolute;
            font-size: 30px;
            animation: caer 5s linear infinite;
            filter: drop-shadow(0 0 10px #ff4500);
        }

        @keyframes caer {
            0% { transform: translateY(-50px) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) scale(0.5); opacity: 0; }
        }

        .mensaje {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid white;
            width: 0;
            display: inline-block;
            animation: maquinaEscribir 6s steps(40, end) forwards;
        }

        .cuenta-regresiva {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            margin-top: 20px;
        }

        .boton-regalo {
            display: none;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background-color: #ff4500;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        @keyframes maquinaEscribir {
            from { width: 0; }
            to { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="mensaje" id="mensaje"></div>
    <div class="cuenta-regresiva" id="cuentaRegresiva"></div>
    <button class="boton-regalo" id="botonRegalo" onclick="descargarRegalo()">🎁 Reclamar regalo</button>

    <script>
        function escribirMensaje(texto, elementoId, velocidad) {
            let i = 0;
            let elemento = document.getElementById(elementoId);
            elemento.innerHTML = "";
            function escribir() {
                if (i < texto.length) {
                    elemento.innerHTML += texto.charAt(i);
                    i++;
                    setTimeout(escribir, velocidad);
                }
            }
            escribir();
        }

        escribirMensaje("Te amo, mi San Valentín 💖", "mensaje", 150);
        
        function actualizarCuentaRegresiva() {
            const fechaObjetivo = new Date(new Date().getFullYear(), 1, 14, 0, 0, 0);
            const ahora = new Date();
            const diferencia = fechaObjetivo - ahora;
            let textoCuenta;
            
            if (diferencia > 0) {
                const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
                const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
                const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);
                textoCuenta = `Faltan ${dias} días, ${horas} horas, ${minutos} minutos y ${segundos} segundos para San Valentín 💕`;
            } else {
                textoCuenta = "¡Feliz San Valentín! 💖";
                document.getElementById("botonRegalo").style.display = "block";
            }
            
            document.getElementById("cuentaRegresiva").innerHTML = textoCuenta;
        }
        
        setInterval(actualizarCuentaRegresiva, 1000);
        actualizarCuentaRegresiva();
        
        function crearCorazon() {
            const corazon = document.createElement("div");
            corazon.classList.add("corazon");
            corazon.innerHTML = "❤️‍🔥";
            corazon.style.left = Math.random() * window.innerWidth + "px";
            corazon.style.top = "-50px";
            corazon.style.animationDuration = (Math.random() * 3 + 2) + "s";
            document.body.appendChild(corazon);
            
            setTimeout(() => {
                corazon.remove();
            }, 5000);
        }
        
        setInterval(crearCorazon, 500);

        function descargarRegalo() {
            const enlace = document.createElement("a");
            enlace.href = "/mnt/data/Feliz%20San%20Valent%C3%ADn.pptx";
            enlace.download = "Feliz San Valentín.pptx";
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
        }
    </script>
</body>
</html>
